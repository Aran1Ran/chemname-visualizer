name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # prebuild 钩子（scripts/copy-assets.mjs）自动将 RDKit wasm 复制到 public/，无需提交二进制
      - name: Copy RDKit wasm to public/
        run: npm run predev

      - name: Run tests (850 cases)
        run: npm test

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
