<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ChemName Visualizer —— 有机化学命名可视化教学工具（完全离线）" />
    <title>ChemName Visualizer · 有机化学命名可视化</title>
    <style>
      /* 加载骨架屏：化学引擎初始化期间显示 */
      html, body, #root { height: 100%; margin: 0; }
      body {
        font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Segoe UI", system-ui, -apple-system, sans-serif;
        background: #f3f4f6;
        color: #1f2937;
      }
      #boot-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #f3f4f6; z-index: 9999; transition: opacity 0.4s ease;
      }
      #boot-splash .spinner {
        width: 44px; height: 44px; border-radius: 50%;
        border: 4px solid #dbeafe; border-top-color: #3b82f6;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #boot-splash .boot-title { font-size: 18px; font-weight: 600; color: #1e3a8a; }
      #boot-splash .boot-sub { font-size: 14px; color: #6b7280; }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="spinner"></div>
      <div class="boot-title">ChemName Visualizer</div>
      <div class="boot-sub">正在加载本地化学引擎（RDKit / Kekule）…</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
